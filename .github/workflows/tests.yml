name: Reproducible research code
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install -r requirements-lock.txt -e .
      - run: python -m unittest discover -s tests -v
      - run: automl-rank evaluate --verify-reference
      - run: automl-rank recommend --csv examples/labeled_query.csv --target target --top 5
